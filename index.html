<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pikolo</title>
<meta name="description" content="A picture quiz for little ones: animals, music, dinosaurs, flowers, trees, mushrooms and landscapes. Spoken in English and French, no reading needed, works offline.">
<meta name="theme-color" content="#6c47ff">
<meta property="og:type" content="website">
<meta property="og:title" content="Pikolo, a picture quiz for little ones">
<meta property="og:description" content="233 pictures to name, hear and discover: animals, music, dinosaurs, flowers, trees, mushrooms and landscapes. English and French, no ads, works offline.">
<meta property="og:url" content="https://bachmannalexis.github.io/Quiz/">
<meta property="og:image" content="https://bachmannalexis.github.io/Quiz/icons/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="app/font.css">
<link rel="stylesheet" href="app/style.css">
</head>
<body>
<!-- Icons: one line style for every control (24×24, drawn with the current text colour) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-speaker" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/><path d="M15.5 9a4 4 0 0 1 0 6M18.5 6a8 8 0 0 1 0 12"/></symbol>
    <symbol id="i-mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M9 21h6"/></symbol>
    <symbol id="i-ear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 9.5a5.5 5.5 0 0 1 11 0c0 3.2-3.5 4.2-3.5 7.5a3 3 0 0 1-6 .5"/><path d="M9.5 9.5a2.5 2.5 0 0 1 5 0c0 1.2-1 1.8-1.8 2.3"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9.5 9"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></symbol>
    <symbol id="i-keys" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M8 20v-6M12 20v-6M16 20v-6"/><path d="M6.5 4v10h3V4M14.5 4v10h3V4" fill="currentColor"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="3.8" ry="9"/><path d="M3.5 9h17M3.5 15h17"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20v-7M12 20V5M19 20v-10"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5.5"/><circle cx="12" cy="7.8" r="0.6" fill="currentColor"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 5.5L8 12l6.5 6.5"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 5.5L16 12l-6.5 6.5"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5.5c3-1.3 6-1.3 9 .8 3-2.1 6-2.1 9-.8v13c-3-1.3-6-1.3-9 .8-3-2.1-6-2.1-9-.8z"/><path d="M12 6.3v13.5"/></symbol>
    <symbol id="i-puzzle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h4a2 2 0 1 1 4 0h4v4a2 2 0 1 1 0 4v4h-4a2 2 0 1 0-4 0H4v-4a2 2 0 1 0 0-4z"/></symbol>
    <symbol id="i-drum" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="9" rx="8" ry="3.5"/><path d="M4 9v7c0 1.9 3.6 3.5 8 3.5s8-1.6 8-3.5V9"/><path d="M8 3.5l3 4M16 3.5l-3 4"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6.5" y="6.5" width="11" height="11" rx="2" fill="currentColor"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M5 12h14"/></symbol>
    <symbol id="i-line" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 17h19M5 15v4M12 15v4M19 15v4"/><path d="M5 12c2-6 5-6 7 0" stroke-dasharray="2.5 2.5"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 2.8l2.8 5.8 6.3.9-4.6 4.4 1.1 6.3L12 17.2l-5.6 3 1.1-6.3L2.9 9.5l6.3-.9z" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
  </defs>
</svg>
<div class="app">

  <!-- Home: pick a topic -->
  <section class="screen" id="look" hidden>
    <header class="bar">
      <div class="brand">
        <img class="logo" src="icons/icon.svg" alt="">
        <span class="wordmark">Pik<span>o</span>l<span>o</span></span>
      </div>
      <div class="bar-tools">
        <button class="pill lang-btn" type="button"></button>
      </div>
    </header>
    <h1 class="look-title" data-t="lookTitle"></h1>
    <div class="look-choices">
      <button class="look-card" type="button" id="look-drawings">
        <span class="look-pics"></span>
        <strong data-t="lookDrawings"></strong>
      </button>
      <button class="look-card" type="button" id="look-photos">
        <span class="look-pics"></span>
        <strong data-t="lookPhotos"></strong>
      </button>
    </div>
    <p class="tagline" data-t="lookHint"></p>
  </section>
  <section class="screen" id="home">
    <header class="bar">
      <div class="brand">
        <img class="logo" src="icons/icon.svg" alt="">
        <span class="wordmark">Pik<span>o</span>l<span>o</span></span>
      </div>
      <div class="bar-tools">
        <button class="pill lang-btn" type="button"></button>
        <button class="icon-btn" type="button" id="lookBtn" data-t-label="lookTitle"><svg class="ic" aria-hidden="true"><use href="#i-image"/></svg></button>
        <button class="icon-btn" type="button" id="scoresBtn" data-t-label="scoresTitle"><svg class="ic" aria-hidden="true"><use href="#i-chart"/></svg></button>
        <button class="icon-btn info-btn" type="button" data-t-label="parents"><svg class="ic" aria-hidden="true"><use href="#i-info"/></svg></button>
      </div>
    </header>
    <p class="tagline" data-t="tagline"></p>
    <div id="topicGrid"></div>
  </section>

  <!-- Topic: pick a group and a game -->
  <section class="screen" id="topic" hidden>
    <header class="bar">
      <button class="icon-btn" type="button" id="topicBack" data-t-label="back"><svg class="ic" aria-hidden="true"><use href="#i-back"/></svg></button>
      <h1 class="bar-title" id="topicTitle"></h1>
      <div class="bar-tools">
        <button class="pill lang-btn" type="button"></button>
      </div>
    </header>
    <div class="hero" id="topicHero"></div>
    <div class="chips" id="groups"></div>
    <div class="chips" id="levels"></div>
    <div class="modes" id="modes"></div>
  </section>

  <!-- Quiz -->
  <section class="screen" id="game" hidden>
    <header class="bar">
      <button class="icon-btn" type="button" id="gameBack" data-t-label="back"><svg class="ic" aria-hidden="true"><use href="#i-back"/></svg></button>
      <div class="progress" id="progress" aria-hidden="true"></div>
      <button class="icon-btn home-btn" type="button" data-t-label="toHome"><svg class="ic" aria-hidden="true"><use href="#i-close"/></svg></button>
    </header>
    <div class="question">
      <button class="speak" type="button" id="speak" data-t-label="repeat"></button>
      <p class="prompt" id="promptText" aria-live="polite"></p>
    </div>
    <div class="math-visual" id="mathVisual" hidden></div>
    <div class="choices" id="choices"></div>
    <p class="mic-hint" id="micHint" data-t="noMic" hidden></p>
    <p class="heard" id="heard" aria-live="polite"></p>
  </section>

  <!-- Puzzle: the picture in pieces -->
  <section class="screen" id="puzzle" hidden>
    <header class="bar">
      <button class="icon-btn" type="button" id="puzzleBack" data-t-label="back"><svg class="ic" aria-hidden="true"><use href="#i-back"/></svg></button>
      <div class="progress" id="puzzleProgress" aria-hidden="true"></div>
      <button class="icon-btn home-btn" type="button" data-t-label="toHome"><svg class="ic" aria-hidden="true"><use href="#i-close"/></svg></button>
    </header>
    <div class="puzzle-board" id="puzzleBoard"></div>
    <div class="puzzle-tray" id="puzzleTray"></div>
  </section>

  <!-- Drums: a drum kit to play and a drum machine -->
  <section class="screen" id="drums" hidden>
    <header class="bar">
      <button class="icon-btn" type="button" id="drumsBack" data-t-label="back"><svg class="ic" aria-hidden="true"><use href="#i-back"/></svg></button>
      <h1 class="bar-title" data-t="drumsTitle"></h1>
      <button class="icon-btn home-btn" type="button" data-t-label="toHome"><svg class="ic" aria-hidden="true"><use href="#i-close"/></svg></button>
    </header>
    <div class="pads" id="pads"></div>
    <div class="beat">
      <div class="beat-tools">
        <button class="speak beat-play" type="button" id="beatPlay" data-t-label="beatPlay"></button>
        <button class="icon-btn" type="button" id="beatSlower" data-t-label="beatSlower">−</button>
        <span class="beat-tempo" id="beatTempo"></span>
        <button class="icon-btn" type="button" id="beatFaster" data-t-label="beatFaster">+</button>
        <button class="pill" type="button" id="beatClear" data-t="beatClear"></button>
      </div>
      <div class="beat-styles" id="beatStyles"></div>
      <div class="beat-grid" id="beatGrid"></div>
    </div>
  </section>

  <!-- End of a quiz -->
  <section class="screen" id="done" hidden>
    <header class="bar">
      <button class="icon-btn" type="button" id="doneBack" data-t-label="back"><svg class="ic" aria-hidden="true"><use href="#i-back"/></svg></button>
      <span class="bar-title"></span>
      <button class="icon-btn home-btn" type="button" data-t-label="toHome"><svg class="ic" aria-hidden="true"><use href="#i-close"/></svg></button>
    </header>
    <div class="done-card">
      <svg class="trophy" aria-hidden="true"><use href="#i-star"/></svg>
      <h2 class="done-title" data-t="bravo"></h2>
      <p class="done-text" id="doneText"></p>
      <div class="done-stars" id="doneStars"></div>
      <p class="record" id="record" data-t="record" hidden></p>
      <div class="done-actions">
        <button class="btn btn-primary" type="button" id="again" data-t="again"></button>
        <button class="btn" type="button" id="otherGame" data-t="otherGame"></button>
      </div>
    </div>
  </section>

  <!-- Play and discover -->
  <section class="screen" id="play" hidden>
    <header class="bar">
      <button class="icon-btn" type="button" id="playBack" data-t-label="back"><svg class="ic" aria-hidden="true"><use href="#i-back"/></svg></button>
      <h1 class="bar-title" id="playTitle"></h1>
      <button class="icon-btn home-btn" type="button" data-t-label="toHome"><svg class="ic" aria-hidden="true"><use href="#i-close"/></svg></button>
    </header>
    <div class="stage">
      <button class="big" type="button" id="bigPic" data-t-label="hearAgain"><img alt=""></button>
      <span class="big-name" id="bigName"></span>
    </div>
    <div class="clock-play" id="clockPlay" hidden>
      <svg class="clock-face" id="clockFace" viewBox="0 0 128 128" role="img"></svg>
      <button class="clock-name" type="button" id="clockName" data-t-label="hearAgain"></button>
      <span class="clock-digits" id="clockDigits"></span>
    </div>
    <div class="keys" id="keys"></div>
    <div class="grid" id="grid"></div>
  </section>
</div>

<!-- For parents -->
<dialog class="sheet small" id="langs">
  <form method="dialog" class="sheet-close"><button class="icon-btn" data-t-label="close"><svg class="ic" aria-hidden="true"><use href="#i-close"/></svg></button></form>
  <h2 data-t="chooseLang"></h2>
  <div class="lang-list" id="langList"></div>
</dialog>

<dialog class="sheet" id="scores">
  <form method="dialog" class="sheet-close"><button class="icon-btn" data-t-label="close"><svg class="ic" aria-hidden="true"><use href="#i-close"/></svg></button></form>
  <div class="sheet-head">
    <img class="logo" src="icons/icon.svg" alt="">
    <h2 data-t="scoresTitle"></h2>
  </div>
  <p class="muted" data-t="scoresIntro"></p>
  <div id="scoreList"></div>
  <button class="btn" type="button" id="clearScores" data-t="clearScores"></button>
</dialog>

<dialog class="sheet" id="about">
  <form method="dialog" class="sheet-close"><button class="icon-btn" data-t-label="close"><svg class="ic" aria-hidden="true"><use href="#i-close"/></svg></button></form>
  <div class="sheet-head">
    <img class="logo" src="icons/icon.svg" alt="">
    <h2 data-t="parentsTitle"></h2>
  </div>
  <p class="muted" data-t="parentsIntro"></p>
  <h3 data-t="howTitle"></h3>
  <ul class="how">
    <li><span class="how-ic"><svg class="ic" aria-hidden="true"><use href="#i-image"/></svg></span><span data-t="howName"></span></li>
    <li><span class="how-ic"><svg class="ic" aria-hidden="true"><use href="#i-mic"/></svg></span><span data-t="howSay"></span></li>
    <li><span class="how-ic"><svg class="ic" aria-hidden="true"><use href="#i-ear"/></svg></span><span data-t="howListen"></span></li>
    <li><span class="how-ic"><svg class="ic" aria-hidden="true"><use href="#i-search"/></svg></span><span data-t="howPlay"></span></li>
    <li><span class="how-ic"><svg class="ic" aria-hidden="true"><use href="#i-star"/></svg></span><span data-t="howStars"></span></li>
  </ul>
  <h3 data-t="shareTitle"></h3>
  <p data-t="shareText"></p>
  <div class="share-row">
    <code class="share-url" id="shareUrl"></code>
    <button class="btn btn-primary" type="button" id="shareBtn" data-t="share"></button>
  </div>
  <p class="muted small" data-t="installTip"></p>
  <h3 data-t="voiceTitle"></h3>
  <div class="share-row">
    <button class="btn btn-primary" type="button" id="voiceTest" data-t="voiceTest"></button>
    <span class="small muted" id="voiceStatus" aria-live="polite"></span>
  </div>
  <p class="muted small" data-t="voiceHelp"></p>
  <h3 data-t="offlineTitle"></h3>
  <p class="small" data-t="offlineText"></p>
  <div class="share-row">
    <button class="btn btn-primary" type="button" id="offlineBtn"></button>
    <span class="small muted" id="offlineStatus" aria-live="polite"></span>
  </div>
  <h3 data-t="recogTitle"></h3>
  <p class="small" data-t="recogText"></p>
  <div class="share-row">
    <button class="btn btn-primary" type="button" id="recogBtn"></button>
    <span class="small muted" id="recogStatus" aria-live="polite"></span>
  </div>
  <h3 data-t="privacyTitle"></h3>
  <p data-t="privacyText"></p>
  <h3 data-t="creditsTitle"></h3>
  <p class="small" data-t-html="creditsText"></p>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="app/packs.js"></script>
<script src="app/topics.js"></script>
<script src="app/levels.js"></script>
<script src="app/words.js"></script>
<script src="app/lang/de.js"></script>
<script src="app/lang/it.js"></script>
<script src="app/app.js"></script>
</body>
</html>
