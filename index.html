<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Picture Quiz</title>
<style>
  :root {
    --bg1: #fff6d6;
    --bg2: #ffd9e8;
    --card: #ffffff;
    --ink: #3b2a55;
    --accent: #ff7a59;
    --good: #4cc38a;
    --shadow: 0 8px 0 rgba(59, 42, 85, 0.15);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow-x: hidden; }
  body {
    font-family: "Comic Sans MS", "Chalkboard SE", "Baloo 2", system-ui, sans-serif;
    color: var(--ink);
    background: linear-gradient(160deg, var(--bg1), var(--bg2));
    display: flex;
    flex-direction: column;
    align-items: center;
    user-select: none;
    overflow-x: hidden;
  }
  header {
    width: 100%;
    max-width: 900px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
  }
  .stars { font-size: 2rem; min-height: 2.5rem; letter-spacing: 2px; }
  .tools { display: flex; gap: 10px; }
  .round-btn {
    font-size: 1.6rem;
    border: none;
    background: var(--card);
    border-radius: 999px;
    padding: 6px 14px;
    box-shadow: var(--shadow);
    cursor: pointer;
  }
  main {
    flex: 1;
    width: 100%;
    max-width: 900px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    justify-content: safe center;
    gap: 24px;
    padding: 0 16px 24px;
  }
  .prompt {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: clamp(1.6rem, 5vw, 2.6rem);
    text-align: center;
  }
  .speak {
    font-size: 2.4rem;
    width: 72px; height: 72px;
    border-radius: 50%;
    border: none;
    background: var(--accent);
    color: white;
    box-shadow: var(--shadow);
    cursor: pointer;
    flex-shrink: 0;
  }
  .speak:active { transform: translateY(4px); box-shadow: 0 4px 0 rgba(59,42,85,.15); }
  .choices {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: clamp(12px, 3vw, 28px);
    width: 100%;
  }
  .choice {
    aspect-ratio: 1;
    border: none;
    border-radius: 32px;
    background: var(--card);
    box-shadow: var(--shadow);
    padding: 0;
    cursor: pointer;
    transition: transform .15s;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4%;
    font: inherit;
    color: var(--ink);
  }
  .choice, .thumb, .big { position: relative; }
  /* poisonous mushrooms */
  .poison::after { content: "⚠️"; position: absolute; top: 6%; right: 8%; font-size: clamp(1rem, 4vw, 1.8rem); }
  .choice img { width: 72%; height: 72%; object-fit: contain; pointer-events: none; transition: height .2s; }
  /* the instrument's name appears once the card is chosen */
  .choice .label { display: none; font-size: clamp(1rem, 3.6vw, 1.6rem); line-height: 1.1; padding: 0 6px; text-align: center; }
  .choice.named img { height: 56%; }
  .choice.named .label { display: block; }
  .choice.right .label { color: #fff; font-weight: bold; }
  .choice:active { transform: scale(.95); }
  .choice.right { background: var(--good); animation: bounce .6s; }
  .choice.wrong { animation: shake .5s; opacity: .45; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20%,60% { transform: translateX(-12px) rotate(-4deg); }
    40%,80% { transform: translateX(12px) rotate(4deg); }
  }
  @keyframes bounce {
    0%,100% { transform: scale(1); }
    40% { transform: scale(1.15) rotate(-5deg); }
    70% { transform: scale(.95) rotate(3deg); }
  }
  .home { display: flex; flex-direction: column; align-items: center; gap: clamp(18px, 4vh, 40px); }
  .topics { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .topic {
    border: 3px solid transparent;
    background: var(--card);
    border-radius: 22px;
    padding: 6px 4px 4px;
    box-shadow: var(--shadow);
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    width: clamp(78px, 21vw, 120px);
    font: inherit;
    font-size: clamp(.78rem, 3.2vw, 1rem);
    color: var(--ink);
  }
  .topic img { width: clamp(40px, 11vw, 56px); height: clamp(40px, 11vw, 56px); }
  .topic[aria-pressed="true"] { border-color: var(--accent); background: #fff1e6; }
  .styles { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
  .style {
    border: 3px solid transparent;
    background: var(--card);
    border-radius: 20px;
    padding: 6px 12px 6px 6px;
    box-shadow: var(--shadow);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    font: inherit;
    font-size: 1.05rem;
    color: var(--ink);
  }
  .style img { width: 44px; height: 44px; }
  .style[aria-pressed="true"] { border-color: var(--accent); background: #fff1e6; }
  .modes {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: clamp(12px, 4vw, 48px);
  }
  .start {
    border: none;
    background: var(--card);
    border-radius: 40px;
    width: clamp(96px, 27vw, 220px);
    aspect-ratio: 1;
    box-shadow: var(--shadow);
    cursor: pointer;
    animation: pulse 1.6s infinite;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }
  .start span { font-size: clamp(3rem, 14vw, 6.5rem); line-height: 1; }
  .start small { font-size: clamp(1.1rem, 5vw, 2.2rem); display: flex; gap: 4px; min-height: 1em; }
  .start small img { width: 1em; height: 1em; }
  .start[data-mode="listen"] { animation-delay: .8s; }
  @keyframes pulse { 50% { transform: scale(1.08); } }
  .hidden { display: none !important; }
  main.playing { justify-content: flex-start; overflow: hidden; }
  .play { width: 100%; flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .stage { display: flex; align-items: center; gap: 16px; }
  .big {
    width: clamp(110px, 28vw, 180px);
    aspect-ratio: 1;
    border: none;
    border-radius: 32px;
    background: var(--card);
    box-shadow: var(--shadow);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }
  .big img { width: 78%; height: 78%; object-fit: contain; pointer-events: none; }
  .big.bounce { animation: bounce .6s; }
  .name { font-size: clamp(1.5rem, 5.5vw, 2.4rem); max-width: 45vw; }
  .keys {
    display: flex;
    gap: 6px;
    width: 100%;
    max-width: 680px;
    height: clamp(90px, 17vh, 160px);
    touch-action: none;
  }
  .key {
    flex: 1;
    border-radius: 16px;
    box-shadow: 0 6px 0 rgba(59, 42, 85, 0.2);
    transition: transform .08s, filter .08s;
  }
  .key.on { transform: translateY(5px) scale(.97); box-shadow: 0 1px 0 rgba(59, 42, 85, 0.2); filter: brightness(1.2); }
  .grid {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    width: 100%;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(76px, 1fr));
    align-content: start;
    gap: 10px;
    padding: 4px 4px 16px;
  }
  .thumb {
    aspect-ratio: 1;
    border: 3px solid transparent;
    border-radius: 20px;
    background: var(--card);
    box-shadow: 0 4px 0 rgba(59, 42, 85, 0.15);
    cursor: pointer;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .thumb img { width: 76%; height: 76%; object-fit: contain; pointer-events: none; }
  .thumb[aria-pressed="true"] { border-color: var(--accent); background: #fff1e6; }
  .confetti {
    position: fixed;
    top: -40px;
    font-size: 2rem;
    pointer-events: none;
    animation: fall linear forwards;
  }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
  @media (max-width: 480px) {
    .choices { display: flex; flex-wrap: wrap; justify-content: center; }
    .choice { width: calc(50% - 8px); }
  }
</style>
</head>
<body>
<header>
  <div class="stars" id="stars" aria-label="score"></div>
  <div class="tools">
    <button class="round-btn hidden" id="homeBtn" aria-label="home">🏠</button>
    <button class="round-btn" id="lang" aria-label="language">🇬🇧</button>
  </div>
</header>

<main>
  <div class="home" id="home">
  <div class="topics" id="topics" aria-label="topic"></div>
  <div class="styles" id="styles" aria-label="group"></div>
  <div class="modes">
    <button class="start" data-mode="name" aria-label="find the picture from its name"><span>🗣️</span><small></small></button>
    <button class="start" data-mode="listen" aria-label="find the picture from its sound"><span>👂</span><small></small></button>
    <button class="start" data-mode="play" aria-label="tap and discover"><span>👆</span><small></small></button>
  </div>
  </div>

  <div class="prompt hidden" id="promptRow">
    <button class="speak" id="speak" aria-label="repeat">🔊</button>
    <span id="promptText"></span>
  </div>
  <div class="choices hidden" id="choices"></div>

  <div class="play hidden" id="play">
    <div class="stage">
      <button class="big" id="bigPic" aria-label="play the tune"><img alt=""></button>
      <span class="name" id="bigName"></span>
    </div>
    <div class="keys" id="keys" aria-label="notes"></div>
    <div class="grid" id="grid"></div>
  </div>
</main>

<script src="sounds.js"></script>
<script src="pictures.js"></script>
<script src="topics.js"></script>
<script>
const TEXT = {
  en: {
    where: (n, many) => `Where ${many ? "are" : "is"} the ${n}?`, listen: "Listen! Who is playing?",
    who: sound => `Who says ${sound}?`, says: (n, sound) => `The ${n} says ${sound}!`,
    poison: "Careful! This mushroom is poisonous. Never eat it!",
    yes: n => `Yes! The ${n}!`, no: "Try again!", bravo: "Bravo! You did it!", flag: "🇬🇧", voice: "en-US",
  },
  fr: {
    where: (n, many) => `Où ${many ? "sont" : "est"} ${n} ?`, listen: "Écoute ! Qui joue ?",
    who: sound => `Qui fait ${sound} ?`, says: (n, sound) => `${cap(n)} fait ${sound} !`,
    poison: "Attention ! Ce champignon est toxique. Il ne faut jamais le manger !",
    yes: n => `Oui ! C'est ${n} !`, no: "Essaie encore !", bravo: "Bravo ! Tu as réussi !", flag: "🇫🇷", voice: "fr-FR",
  },
};
const CONFETTI = {
  instruments: ["🎵", "🎶", "⭐", "🎉", "✨"], animals: ["🐾", "⭐", "🎉", "✨"], flowers: ["🌸", "🌼", "⭐", "✨"],
  trees: ["🍃", "🍂", "⭐", "✨"], mushrooms: ["🍄", "⭐", "🎉", "✨"], scenery: ["☀️", "☁️", "⭐", "✨"],
  dinosaurs: ["🦖", "🦕", "⭐", "✨"],
};

const ROUNDS = 10;
const CHOICES = 3;

const $ = id => document.getElementById(id);
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const store = {
  get(k, d) { try { return localStorage.getItem(k) || d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};

let lang = store.get("quiz-lang", navigator.language.startsWith("fr") ? "fr" : "en");
let topic = TOPICS.find(t => t.id === store.get("quiz-topic")) || TOPICS[0];
const groupOf = {}; // topic id -> chosen group
TOPICS.forEach(t => { groupOf[t.id] = store.get("quiz-group-" + t.id, t.id === "instruments" ? store.get("quiz-style", "all") : "all"); });
const ITEMS = new Map(TOPICS.flatMap(t => t.items.map(i => [i.id, i])));
let deck = []; // items still to ask this game, so nothing repeats
let mode = "name", round = 0, stars = 0, answer = null, locked = false, firstTry = true, lastAnswer = null;
let gameId = 0; // bumps when a game starts or ends, so its pending timers do nothing
let questionId = 0; // bumps every question so stale timers/speech callbacks do nothing

const isMusic = () => topic.id === "instruments";
const nameOf = item => item[lang];
const shortName = item => cap(item[lang].replace(/^(le |la |les |l')/, "")); // "la flûte à bec" -> "Flûte à bec"
const soundOf = item => item.says && item.says[lang === "en" ? 0 : 1];

// ---------- Speech ----------
function say(text, onDone) {
  let done = false;
  const finish = () => { if (!done) { done = true; onDone && onDone(); } };
  if (!("speechSynthesis" in window)) { setTimeout(finish, 300); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = TEXT[lang].voice;
  u.rate = 0.85;
  u.pitch = 1.2;
  const v = speechSynthesis.getVoices().find(v => v.lang.replace("_", "-").startsWith(lang));
  if (v) u.voice = v;
  u.onend = finish;
  u.onerror = finish;
  speechSynthesis.speak(u);
  if (onDone) setTimeout(finish, 1500 + text.length * 90); // some browsers never fire onend
}

// ---------- Sounds ----------
let ctx, current, playToken = 0;
const buffers = {}; // id -> Promise<AudioBuffer>
function audio() {
  ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
  if (ctx.state === "suspended") ctx.resume();
  return ctx;
}
// Decode an embedded recording the first time it is needed (data: URIs, so it also
// works when the page is opened as a local file). Tunes are keyed by instrument id,
// play-mode sounds by "id#k".
function recording(id) {
  const [iid, k] = id.split("#");
  const uri = k === undefined ? (window.INSTRUMENT_SOUNDS || {})[iid] : ((window.INSTRUMENT_NOTES || {})[iid] || { samples: [] }).samples[k];
  if (!buffers[id] && uri) {
    const bin = atob(uri.split(",")[1]);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    buffers[id] = new Promise((ok, fail) => audio().decodeAudioData(bytes.buffer, ok, fail));
    buffers[id].catch(() => { delete buffers[id]; });
  }
  return buffers[id] || Promise.reject();
}
function tone(freq, start, len, wave = "sine", vol = 0.25) {
  const a = audio(), o = a.createOscillator(), g = a.createGain();
  o.type = wave; o.frequency.value = freq;
  const t = a.currentTime + start;
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.001, t + len);
  o.connect(g).connect(a.destination);
  o.start(t); o.stop(t + len + 0.05);
}
function stopSound() { if (current) { try { current.stop(); } catch (e) {} current = null; } }
function playInstrument(inst) {
  stopSound();
  const token = ++playToken;
  // waits for the recording if it is still decoding; a newer play request wins
  recording(inst.id).then(b => {
    if (token !== playToken) return;
    const src = audio().createBufferSource();
    src.buffer = b;
    src.connect(audio().destination);
    src.start();
    current = src;
  }, () => {});
}
// Play-mode keys: a pentatonic scale, so every combination sounds nice.
const KEY_STEPS = [-5, -3, 0, 2, 4, 7, 9, 12];
const KEY_COLORS = ["#e53935", "#fb8c00", "#fdd835", "#7cb342", "#26a69a", "#1e88e5", "#5e35b1", "#d81b60"];
function playNote(inst, k) {
  stopSound(); playToken++;
  const info = window.INSTRUMENT_NOTES[inst.id];
  // several sounds (drum kit, tabla): one per key; one sound: tuned up and down
  const many = info.samples.length > 1;
  const steps = many ? 0 : info.pitched ? KEY_STEPS[k] : KEY_STEPS[k] / 2;
  recording(inst.id + "#" + (many ? k % info.samples.length : 0)).then(b => {
    const src = audio().createBufferSource();
    src.buffer = b;
    src.playbackRate.value = Math.pow(2, steps / 12);
    src.connect(audio().destination);
    src.start();
  }, () => {});
}
function cheer() { [523, 659, 784, 1047].forEach((n, i) => tone(n, i * 0.09, 0.25, "triangle", 0.2)); }
function boop() { tone(220, 0, 0.2, "sine", 0.2); tone(180, 0.12, 0.25, "sine", 0.2); }

// ---------- Pools ----------
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
const families = items => new Set(items.map(i => i.family)).size;
// the chosen group of the current topic
function groupPool() {
  const g = groupOf[topic.id];
  return g === "all" ? topic.items : topic.items.filter(i => i.styles.includes(g));
}
// what a game asks about: in the animal sound game, only animals with a sound; if the
// group has too few, all of them
function gamePool() {
  if (mode !== "listen" || isMusic()) return groupPool();
  const pool = groupPool().filter(i => i.says);
  return families(pool) >= CHOICES ? pool : topic.items.filter(i => i.says);
}

// what the voice adds after naming an item: an animal's sound or a mushroom warning
function extra(item) {
  if (item.says) return TEXT[lang].says(nameOf(item), soundOf(item));
  if (item.poison) return TEXT[lang].poison;
  return "";
}

// ---------- Home ----------
function picture(id) {
  const img = document.createElement("img");
  img.src = window.INSTRUMENT_PICTURES[id];
  img.alt = "";
  return img;
}

function renderHome() {
  document.querySelectorAll(".topic").forEach(b => {
    const t = TOPICS.find(x => x.id === b.dataset.topic);
    b.setAttribute("aria-pressed", t === topic);
    b.querySelector("span").textContent = t[lang];
  });
  const styles = $("styles");
  styles.innerHTML = "";
  styles.classList.toggle("hidden", !topic.groups);
  (topic.groups || []).forEach(st => {
    const b = document.createElement("button");
    b.className = "style";
    b.setAttribute("aria-pressed", st.id === groupOf[topic.id]);
    const label = document.createElement("span");
    label.textContent = st[lang];
    b.append(picture(st.pic), label);
    b.onclick = () => {
      groupOf[topic.id] = st.id;
      store.set("quiz-group-" + topic.id, st.id);
      renderHome();
      if (isMusic()) playInstrument(ITEMS.get(st.pic)); // a taste of the style
      else say(st[lang]);
    };
    styles.appendChild(b);
  });
  // the games this topic offers, with a few of its pictures on each button
  const show = m => topic.modes.includes(m) || (m === "play" && topic.modes.includes("explore"));
  document.querySelectorAll(".start").forEach(b => {
    b.classList.toggle("hidden", !show(b.dataset.mode));
    const mini = b.querySelector("small");
    mini.innerHTML = "";
    if (b.dataset.mode === "listen" && isMusic()) mini.textContent = "🎵🎶🎵";
    else {
      const pool = b.dataset.mode === "listen" ? topic.items.filter(i => i.says) : topic.items;
      const offset = { name: 0, listen: 4, play: 8 }[b.dataset.mode];
      pool.slice(offset, offset + 3).forEach(i => mini.appendChild(picture(i.id)));
    }
  });
}

function selectTopic(t) {
  topic = t;
  store.set("quiz-topic", t.id);
  renderHome();
  say(t[lang]);
}

// ---------- Quiz ----------
function renderStars() { $("stars").textContent = "⭐".repeat(stars); }

function promptText() {
  if (mode !== "listen") return TEXT[lang].where(nameOf(answer), answer.many);
  return isMusic() ? TEXT[lang].listen : TEXT[lang].who(soundOf(answer));
}

// Ask (or re-ask) the current question: speak the name, say "Listen!" then play the
// instrument, or ask "Who says moo?".
function ask() {
  const q = questionId;
  if (mode === "listen" && isMusic()) say(TEXT[lang].listen, () => { if (q === questionId) playInstrument(answer); });
  else say(promptText());
}

function card(item) {
  const b = document.createElement("button");
  b.className = "choice" + (item.poison ? " poison" : "");
  b.dataset.id = item.id;
  b.setAttribute("aria-label", nameOf(item));
  const label = document.createElement("span");
  label.className = "label";
  b.append(picture(item.id), label);
  return b;
}

function askQuestion() {
  locked = false; firstTry = true; questionId++;
  const pool = gamePool();
  // go through the pool in random order before repeating anything
  if (!deck.length) deck = shuffle(pool.filter(i => i !== lastAnswer));
  answer = deck.pop();
  lastAnswer = answer;
  if (isMusic()) recording(answer.id); // start decoding now so the sound is ready
  // wrong choices come from other families, so pictures and sounds are easy to tell
  // apart; prefer the same group, and in the animal sound game animals with a sound
  const fallback = mode === "listen" && !isMusic() ? topic.items.filter(i => i.says) : topic.items;
  const others = [];
  for (const i of [...shuffle(pool), ...shuffle(fallback)]) {
    if (others.length < CHOICES - 1 && i.family !== answer.family && !others.some(o => o.family === i.family)) others.push(i);
  }
  const box = $("choices");
  box.innerHTML = "";
  shuffle([answer, ...others]).forEach(item => {
    const b = card(item);
    b.onclick = () => pick(item, b);
    box.appendChild(b);
  });
  $("promptText").textContent = promptText();
  ask();
}

function showName(btn, item) {
  btn.querySelector(".label").textContent = shortName(item);
  btn.classList.add("named");
}

function pick(item, btn) {
  if (locked) return;
  const q = questionId;
  showName(btn, item);
  if (item === answer) {
    locked = true;
    questionId++; // cancel any pending replay of the question
    btn.classList.add("right");
    $("promptText").textContent = TEXT[lang].yes(nameOf(item));
    cheer();
    if (firstTry) { stars++; renderStars(); }
    confetti(12);
    round++;
    const g = gameId;
    const next = () => { if (g === gameId) (round >= ROUNDS ? finish : askQuestion)(); };
    const hear = isMusic() && mode === "name"; // found by name: now let them hear it
    // "Yes! The cow! The cow says moo!", then the next question
    say(`${TEXT[lang].yes(nameOf(item))} ${isMusic() ? "" : extra(item)}`, () => {
      if (g !== gameId) return;
      if (hear) playInstrument(item);
      setTimeout(next, hear ? 3000 : 900);
    });
  } else {
    firstTry = false;
    btn.classList.add("wrong");
    btn.disabled = true;
    boop();
    if (mode === "listen" && isMusic()) {
      // play the right sound again so they can compare
      setTimeout(() => { if (q === questionId) playInstrument(answer); }, 500);
    } else {
      // say what they tapped ("The cat says meow!"), then gently ask again
      const what = mode === "listen" && item.says ? extra(item) : `${shortName(item)}.`;
      say(`${what} ${TEXT[lang].no}`, () => { if (q === questionId) setTimeout(() => { if (q === questionId) ask(); }, 400); });
    }
  }
}

// ---------- Play and explore ----------
let playing = null; // item on the stage

function selectItem(item, speak = true) {
  playing = item;
  $("bigPic").querySelector("img").src = window.INSTRUMENT_PICTURES[item.id];
  $("bigPic").classList.toggle("poison", !!item.poison);
  $("bigName").textContent = shortName(item);
  document.querySelectorAll(".thumb").forEach(t => t.setAttribute("aria-pressed", t.dataset.id === item.id));
  if (isMusic()) recording(item.id + "#0");
  if (speak) sayItem();
}

// say the item's name, then play its tune or add its sound or warning
function sayItem() {
  const q = ++questionId;
  bounce();
  if (isMusic()) say(nameOf(playing), () => { if (q === questionId) { bounce(); playInstrument(playing); } });
  else say(`${cap(nameOf(playing))}. ${extra(playing)}`);
}

function bounce() {
  const big = $("bigPic");
  big.classList.remove("bounce"); void big.offsetWidth; big.classList.add("bounce");
}

function enterPlay() {
  const grid = $("grid");
  grid.innerHTML = "";
  $("keys").classList.toggle("hidden", !isMusic());
  groupPool().forEach(item => {
    const b = document.createElement("button");
    b.className = "thumb" + (item.poison ? " poison" : "");
    b.dataset.id = item.id;
    b.setAttribute("aria-label", nameOf(item));
    b.appendChild(picture(item.id));
    b.onclick = () => selectItem(item);
    grid.appendChild(b);
  });
  selectItem(groupPool()[0], false);
}

// keys: press, or slide a finger across them
const pressed = new Map(); // pointerId -> key index
function keyAt(x, y) {
  const el = document.elementFromPoint(x, y);
  return el && el.classList.contains("key") ? +el.dataset.k : -1;
}
function press(pointerId, k) {
  if (pressed.get(pointerId) === k) return;
  const old = pressed.get(pointerId);
  if (old !== undefined && old >= 0) $("keys").children[old].classList.remove("on");
  pressed.set(pointerId, k);
  if (k >= 0) { $("keys").children[k].classList.add("on"); playNote(playing, k); }
}
function release(e) {
  const k = pressed.get(e.pointerId);
  if (k !== undefined && k >= 0) $("keys").children[k].classList.remove("on");
  pressed.delete(e.pointerId);
}

// ---------- Screens ----------
function goHome() {
  gameId++; questionId++; playToken++;
  stopSound();
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  ["promptRow", "choices", "play", "homeBtn"].forEach(id => $(id).classList.add("hidden"));
  document.querySelector("main").classList.remove("playing");
  $("home").classList.remove("hidden");
  stars = 0; renderStars();
}

function finish() {
  say(TEXT[lang].bravo);
  confetti(60);
  $("promptRow").classList.add("hidden");
  $("choices").classList.add("hidden");
  $("home").classList.remove("hidden");
  $("homeBtn").classList.add("hidden");
}

function start(m) {
  audio();
  gameId++;
  mode = m === "play" && !isMusic() ? "explore" : m;
  $("homeBtn").classList.remove("hidden");
  $("home").classList.add("hidden");
  stars = 0; renderStars();
  if (mode === "play" || mode === "explore") {
    $("play").classList.remove("hidden");
    document.querySelector("main").classList.add("playing");
    enterPlay();
    return;
  }
  round = 0; lastAnswer = null; deck = [];
  $("speak").textContent = mode === "listen" ? "👂" : "🔊";
  $("promptRow").classList.remove("hidden");
  $("choices").classList.remove("hidden");
  askQuestion();
}

function confetti(n) {
  const bits = CONFETTI[topic.id];
  for (let i = 0; i < n; i++) {
    const s = document.createElement("span");
    s.className = "confetti";
    s.textContent = bits[i % bits.length];
    s.style.left = Math.random() * 90 + "vw";
    s.style.animationDuration = 1.5 + Math.random() * 1.5 + "s";
    s.style.animationDelay = Math.random() * 0.5 + "s";
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 3600);
  }
}

function setLang(l) {
  lang = l;
  store.set("quiz-lang", l);
  $("lang").textContent = TEXT[l].flag;
  document.documentElement.lang = l;
  renderHome();
  if (answer && !$("choices").classList.contains("hidden")) {
    document.querySelectorAll(".choice").forEach(b => {
      const item = ITEMS.get(b.dataset.id);
      b.setAttribute("aria-label", nameOf(item));
      if (b.classList.contains("named")) b.querySelector(".label").textContent = shortName(item);
    });
    $("promptText").textContent = locked ? TEXT[lang].yes(nameOf(answer)) : promptText();
    if (!locked) ask();
  }
  if (playing && !$("play").classList.contains("hidden")) {
    document.querySelectorAll(".thumb").forEach(b => b.setAttribute("aria-label", nameOf(ITEMS.get(b.dataset.id))));
    selectItem(playing, false);
  }
}

TOPICS.forEach(t => {
  const b = document.createElement("button");
  b.className = "topic";
  b.dataset.topic = t.id;
  b.append(picture(t.pic), document.createElement("span"));
  b.onclick = () => selectTopic(t);
  $("topics").appendChild(b);
});
document.querySelectorAll(".start").forEach(b => b.onclick = () => start(b.dataset.mode));
$("speak").onclick = () => { if (!locked) ask(); };
KEY_COLORS.forEach((c, k) => {
  const key = document.createElement("div");
  key.className = "key";
  key.dataset.k = k;
  key.style.background = c;
  $("keys").appendChild(key);
});
$("keys").addEventListener("pointerdown", e => { e.preventDefault(); $("keys").releasePointerCapture?.(e.pointerId); press(e.pointerId, keyAt(e.clientX, e.clientY)); });
$("keys").addEventListener("pointermove", e => { if (pressed.has(e.pointerId)) press(e.pointerId, keyAt(e.clientX, e.clientY)); });
["pointerup", "pointercancel", "pointerleave"].forEach(t => $("keys").addEventListener(t, release));
$("bigPic").onclick = sayItem;
$("homeBtn").onclick = goHome;
$("lang").onclick = () => setLang(lang === "en" ? "fr" : "en");
setLang(lang);
</script>
</body>
</html>
