<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pikolo</title>
<meta name="description" content="A picture quiz for little ones: animals, music, dinosaurs, flowers, trees, mushrooms and landscapes. Spoken in English and French, no reading needed, works offline.">
<meta name="theme-color" content="#6c47ff">
<meta property="og:type" content="website">
<meta property="og:title" content="Pikolo, a picture quiz for little ones">
<meta property="og:description" content="233 pictures to name, hear and discover: animals, music, dinosaurs, flowers, trees, mushrooms and landscapes. English and French, no ads, works offline.">
<meta property="og:url" content="https://bachmannalexis.github.io/Quiz/">
<meta property="og:image" content="https://bachmannalexis.github.io/Quiz/icons/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="app/font.css">
<link rel="stylesheet" href="app/style.css">
</head>
<body>
<div class="app">

  <!-- Home: pick a topic -->
  <section class="screen" id="home">
    <header class="bar">
      <div class="brand">
        <img class="logo" src="icons/icon.svg" alt="">
        <span class="wordmark">Pik<span>o</span>l<span>o</span></span>
      </div>
      <div class="bar-tools">
        <button class="pill lang-btn" type="button"></button>
        <button class="icon-btn info-btn" type="button" data-t-label="parents">?</button>
      </div>
    </header>
    <p class="tagline" data-t="tagline"></p>
    <div class="topic-grid" id="topicGrid"></div>
  </section>

  <!-- Topic: pick a group and a game -->
  <section class="screen" id="topic" hidden>
    <header class="bar">
      <button class="icon-btn" type="button" id="topicBack" data-t-label="back">←</button>
      <h1 class="bar-title" id="topicTitle"></h1>
      <div class="bar-tools">
        <button class="pill lang-btn" type="button"></button>
      </div>
    </header>
    <div class="hero" id="topicHero"></div>
    <div class="chips" id="groups"></div>
    <div class="modes" id="modes"></div>
  </section>

  <!-- Quiz -->
  <section class="screen" id="game" hidden>
    <header class="bar">
      <button class="icon-btn" type="button" id="gameClose" data-t-label="close">✕</button>
      <div class="progress" id="progress" aria-hidden="true"></div>
      <span class="bar-spacer"></span>
    </header>
    <div class="question">
      <button class="speak" type="button" id="speak" data-t-label="repeat"></button>
      <p class="prompt" id="promptText" aria-live="polite"></p>
    </div>
    <div class="choices" id="choices"></div>
  </section>

  <!-- End of a quiz -->
  <section class="screen" id="done" hidden>
    <div class="done-card">
      <div class="trophy">🏆</div>
      <h2 class="done-title" data-t="bravo"></h2>
      <p class="done-text" id="doneText"></p>
      <div class="done-stars" id="doneStars"></div>
      <p class="record" id="record" data-t="record" hidden></p>
      <div class="done-actions">
        <button class="btn btn-primary" type="button" id="again" data-t="again"></button>
        <button class="btn" type="button" id="otherGame" data-t="otherGame"></button>
      </div>
    </div>
  </section>

  <!-- Play and discover -->
  <section class="screen" id="play" hidden>
    <header class="bar">
      <button class="icon-btn" type="button" id="playClose" data-t-label="close">✕</button>
      <h1 class="bar-title" id="playTitle"></h1>
      <span class="bar-spacer"></span>
    </header>
    <div class="stage">
      <button class="big" type="button" id="bigPic" data-t-label="hearAgain"><img alt=""></button>
      <span class="big-name" id="bigName"></span>
    </div>
    <div class="keys" id="keys"></div>
    <div class="grid" id="grid"></div>
  </section>
</div>

<!-- For parents -->
<dialog class="sheet" id="about">
  <form method="dialog" class="sheet-close"><button class="icon-btn" data-t-label="close">✕</button></form>
  <div class="sheet-head">
    <img class="logo" src="icons/icon.svg" alt="">
    <h2 data-t="parentsTitle"></h2>
  </div>
  <p class="muted" data-t="parentsIntro"></p>
  <h3 data-t="howTitle"></h3>
  <ul class="how">
    <li><span>🗣️</span><span data-t="howName"></span></li>
    <li><span>👂</span><span data-t="howListen"></span></li>
    <li><span>👆</span><span data-t="howPlay"></span></li>
    <li><span>⭐</span><span data-t="howStars"></span></li>
  </ul>
  <h3 data-t="shareTitle"></h3>
  <p data-t="shareText"></p>
  <div class="share-row">
    <code class="share-url" id="shareUrl"></code>
    <button class="btn btn-primary" type="button" id="shareBtn" data-t="share"></button>
  </div>
  <p class="muted small" data-t="installTip"></p>
  <h3 data-t="voiceTitle"></h3>
  <div class="share-row">
    <button class="btn btn-primary" type="button" id="voiceTest" data-t="voiceTest"></button>
    <span class="small muted" id="voiceStatus" aria-live="polite"></span>
  </div>
  <p class="muted small" data-t="voiceHelp"></p>
  <h3 data-t="privacyTitle"></h3>
  <p data-t="privacyText"></p>
  <h3 data-t="creditsTitle"></h3>
  <p class="small" data-t-html="creditsText"></p>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="app/pictures.js"></script>
<script src="app/topics.js"></script>
<script src="app/words.js"></script>
<script src="app/app.js"></script>
<!-- the instrument sounds (2.6 MB) load in the background without delaying the page -->
<script src="app/sounds.js" async></script>
</body>
</html>
