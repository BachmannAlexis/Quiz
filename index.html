<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Instrument Quiz</title>
<style>
  :root {
    --bg1: #fff6d6;
    --bg2: #ffd9e8;
    --card: #ffffff;
    --ink: #3b2a55;
    --accent: #ff7a59;
    --good: #4cc38a;
    --shadow: 0 8px 0 rgba(59, 42, 85, 0.15);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow-x: hidden; }
  body {
    font-family: "Comic Sans MS", "Chalkboard SE", "Baloo 2", system-ui, sans-serif;
    color: var(--ink);
    background: linear-gradient(160deg, var(--bg1), var(--bg2));
    display: flex;
    flex-direction: column;
    align-items: center;
    user-select: none;
    overflow-x: hidden;
  }
  header {
    width: 100%;
    max-width: 900px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
  }
  .stars { font-size: 2rem; min-height: 2.5rem; letter-spacing: 2px; }
  .tools { display: flex; gap: 10px; }
  .round-btn {
    font-size: 1.6rem;
    border: none;
    background: var(--card);
    border-radius: 999px;
    padding: 6px 14px;
    box-shadow: var(--shadow);
    cursor: pointer;
  }
  main {
    flex: 1;
    width: 100%;
    max-width: 900px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    padding: 0 16px 24px;
  }
  .prompt {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: clamp(1.6rem, 5vw, 2.6rem);
    text-align: center;
  }
  .speak {
    font-size: 2.4rem;
    width: 72px; height: 72px;
    border-radius: 50%;
    border: none;
    background: var(--accent);
    color: white;
    box-shadow: var(--shadow);
    cursor: pointer;
    flex-shrink: 0;
  }
  .speak:active { transform: translateY(4px); box-shadow: 0 4px 0 rgba(59,42,85,.15); }
  .choices {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: clamp(12px, 3vw, 28px);
    width: 100%;
  }
  .choice {
    aspect-ratio: 1;
    border: none;
    border-radius: 32px;
    background: var(--card);
    box-shadow: var(--shadow);
    padding: 0;
    cursor: pointer;
    transition: transform .15s;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4%;
    font: inherit;
    color: var(--ink);
  }
  .choice img { width: 72%; height: 72%; object-fit: contain; pointer-events: none; transition: height .2s; }
  /* the instrument's name appears once the card is chosen */
  .choice .label { display: none; font-size: clamp(1rem, 3.6vw, 1.6rem); line-height: 1.1; padding: 0 6px; text-align: center; }
  .choice.named img { height: 56%; }
  .choice.named .label { display: block; }
  .choice.right .label { color: #fff; font-weight: bold; }
  .choice:active { transform: scale(.95); }
  .choice.right { background: var(--good); animation: bounce .6s; }
  .choice.wrong { animation: shake .5s; opacity: .45; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20%,60% { transform: translateX(-12px) rotate(-4deg); }
    40%,80% { transform: translateX(12px) rotate(4deg); }
  }
  @keyframes bounce {
    0%,100% { transform: scale(1); }
    40% { transform: scale(1.15) rotate(-5deg); }
    70% { transform: scale(.95) rotate(3deg); }
  }
  .home { display: flex; flex-direction: column; align-items: center; gap: clamp(24px, 5vh, 48px); }
  .styles { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
  .style {
    border: 3px solid transparent;
    background: var(--card);
    border-radius: 20px;
    padding: 6px 12px 6px 6px;
    box-shadow: var(--shadow);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    font: inherit;
    font-size: 1.05rem;
    color: var(--ink);
  }
  .style img { width: 44px; height: 44px; }
  .style[aria-pressed="true"] { border-color: var(--accent); background: #fff1e6; }
  .modes {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: clamp(20px, 6vw, 56px);
  }
  .start {
    border: none;
    background: var(--card);
    border-radius: 40px;
    width: clamp(150px, 38vw, 260px);
    aspect-ratio: 1;
    box-shadow: var(--shadow);
    cursor: pointer;
    animation: pulse 1.6s infinite;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }
  .start span { font-size: clamp(4rem, 18vw, 7.5rem); line-height: 1; }
  .start small { font-size: clamp(1.4rem, 6vw, 2.4rem); display: flex; gap: 4px; }
  .start small img { width: 1em; height: 1em; }
  .start[data-mode="listen"] { animation-delay: .8s; }
  @keyframes pulse { 50% { transform: scale(1.08); } }
  .hidden { display: none !important; }
  main.playing { justify-content: flex-start; overflow: hidden; }
  .play { width: 100%; flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .stage { display: flex; align-items: center; gap: 16px; }
  .big {
    width: clamp(110px, 28vw, 180px);
    aspect-ratio: 1;
    border: none;
    border-radius: 32px;
    background: var(--card);
    box-shadow: var(--shadow);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }
  .big img { width: 78%; height: 78%; object-fit: contain; pointer-events: none; }
  .big.bounce { animation: bounce .6s; }
  .name { font-size: clamp(1.5rem, 5.5vw, 2.4rem); max-width: 45vw; }
  .keys {
    display: flex;
    gap: 6px;
    width: 100%;
    max-width: 680px;
    height: clamp(90px, 17vh, 160px);
    touch-action: none;
  }
  .key {
    flex: 1;
    border-radius: 16px;
    box-shadow: 0 6px 0 rgba(59, 42, 85, 0.2);
    transition: transform .08s, filter .08s;
  }
  .key.on { transform: translateY(5px) scale(.97); box-shadow: 0 1px 0 rgba(59, 42, 85, 0.2); filter: brightness(1.2); }
  .grid {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    width: 100%;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(76px, 1fr));
    align-content: start;
    gap: 10px;
    padding: 4px 4px 16px;
  }
  .thumb {
    aspect-ratio: 1;
    border: 3px solid transparent;
    border-radius: 20px;
    background: var(--card);
    box-shadow: 0 4px 0 rgba(59, 42, 85, 0.15);
    cursor: pointer;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .thumb img { width: 76%; height: 76%; object-fit: contain; pointer-events: none; }
  .thumb[aria-pressed="true"] { border-color: var(--accent); background: #fff1e6; }
  .confetti {
    position: fixed;
    top: -40px;
    font-size: 2rem;
    pointer-events: none;
    animation: fall linear forwards;
  }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
  @media (max-width: 480px) {
    .choices { display: flex; flex-wrap: wrap; justify-content: center; }
    .choice { width: calc(50% - 8px); }
  }
</style>
</head>
<body>
<header>
  <div class="stars" id="stars" aria-label="score"></div>
  <div class="tools">
    <button class="round-btn hidden" id="homeBtn" aria-label="home">🏠</button>
    <button class="round-btn" id="lang" aria-label="language">🇬🇧</button>
  </div>
</header>

<main>
  <div class="home" id="home">
  <div class="styles" id="styles" aria-label="music style"></div>
  <div class="modes">
    <button class="start" data-mode="name" aria-label="find the picture from its name"><span>🗣️</span><small class="mini" data-pics="guitar piano trumpet"></small></button>
    <button class="start" data-mode="listen" aria-label="find the picture from its sound"><span>👂</span><small>🎵🎶🎵</small></button>
    <button class="start" data-mode="play" aria-label="play the instruments"><span>👆</span><small class="mini" data-pics="drum xylophone trumpet"></small></button>
  </div>
  </div>

  <div class="prompt hidden" id="promptRow">
    <button class="speak" id="speak" aria-label="repeat">🔊</button>
    <span id="promptText"></span>
  </div>
  <div class="choices hidden" id="choices"></div>

  <div class="play hidden" id="play">
    <div class="stage">
      <button class="big" id="bigPic" aria-label="play the tune"><img alt=""></button>
      <span class="name" id="bigName"></span>
    </div>
    <div class="keys" id="keys" aria-label="notes"></div>
    <div class="grid" id="grid"></div>
  </div>
</main>

<script src="sounds.js"></script>
<script src="pictures.js"></script>
<script>
// Each instrument: names, styles, and a family. Instruments of the same family look or sound
// alike (trumpet / trombone), so a question never shows two of them together.
// Pictures are in pictures.js, sounds in sounds.js. `many` = plural in English ("Where are the…").
const O = "orchestra", J = "jazz", R = "rock", W = "world";
const INSTRUMENTS = [
  // strings
  { id: "violin",          en: "violin",          fr: "le violon",            family: "bowed",   styles: [O] },
  { id: "cello",           en: "cello",           fr: "le violoncelle",       family: "bowed",   styles: [O] },
  { id: "double-bass",     en: "double bass",     fr: "la contrebasse",       family: "bowed",   styles: [O, J] },
  { id: "harp",            en: "harp",            fr: "la harpe",             family: "harp",    styles: [O] },
  { id: "guitar",          en: "guitar",          fr: "la guitare",           family: "guitar",  styles: [R, W] },
  { id: "electric-guitar", en: "electric guitar", fr: "la guitare électrique", family: "guitar", styles: [R] },
  { id: "bass-guitar",     en: "bass guitar",     fr: "la guitare basse",     family: "guitar",  styles: [R] },
  { id: "banjo",           en: "banjo",           fr: "le banjo",             family: "guitar",  styles: [J, W] },
  { id: "ukulele",         en: "ukulele",         fr: "le ukulélé",           family: "guitar",  styles: [W] },
  { id: "sitar",           en: "sitar",           fr: "le sitar",             family: "guitar",  styles: [W] },
  { id: "shamisen",        en: "shamisen",        fr: "le shamisen",          family: "guitar",  styles: [W] },
  { id: "koto",            en: "koto",            fr: "le koto",              family: "harp",    styles: [W] },
  // keyboards
  { id: "piano",           en: "piano",           fr: "le piano",             family: "keys",    styles: [O, J, R] },
  { id: "pipe-organ",      en: "pipe organ",      fr: "l'orgue",              family: "keys",    styles: [O] },
  { id: "synthesizer",     en: "synthesizer",     fr: "le synthétiseur",      family: "keys",    styles: [R] },
  { id: "accordion",       en: "accordion",       fr: "l'accordéon",          family: "reed",    styles: [W] },
  { id: "harmonica",       en: "harmonica",       fr: "l'harmonica",          family: "reed",    styles: [J, R] },
  { id: "bagpipes",        en: "bagpipes",        fr: "la cornemuse",         family: "reed",    styles: [W], many: true },
  // woodwinds
  { id: "flute",           en: "flute",           fr: "la flûte",             family: "flute",   styles: [O] },
  { id: "recorder",        en: "recorder",        fr: "la flûte à bec",       family: "flute",   styles: [W] },
  { id: "pan-flute",       en: "pan flute",       fr: "la flûte de Pan",      family: "flute",   styles: [W] },
  { id: "ocarina",         en: "ocarina",         fr: "l'ocarina",            family: "flute",   styles: [W] },
  { id: "whistle",         en: "whistle",         fr: "le sifflet",           family: "flute",   styles: [W] },
  { id: "clarinet",        en: "clarinet",        fr: "la clarinette",        family: "pipe",    styles: [O, J] },
  { id: "oboe",            en: "oboe",            fr: "le hautbois",          family: "pipe",    styles: [O] },
  { id: "bassoon",         en: "bassoon",         fr: "le basson",            family: "pipe",    styles: [O] },
  { id: "saxophone",       en: "saxophone",       fr: "le saxophone",         family: "pipe",    styles: [J] },
  // brass
  { id: "trumpet",         en: "trumpet",         fr: "la trompette",         family: "brass",   styles: [O, J] },
  { id: "trombone",        en: "trombone",        fr: "le trombone",          family: "brass",   styles: [O, J] },
  { id: "horn",            en: "French horn",     fr: "le cor",               family: "brass",   styles: [O] },
  { id: "tuba",            en: "tuba",            fr: "le tuba",              family: "brass",   styles: [O, J] },
  // drums
  { id: "drum",            en: "drum",            fr: "le tambour",           family: "drum",    styles: [O] },
  { id: "bass-drum",       en: "bass drum",       fr: "la grosse caisse",     family: "drum",    styles: [O] },
  { id: "timpani",         en: "timpani",         fr: "les timbales",         family: "drum",    styles: [O], many: true },
  { id: "drum-kit",        en: "drum kit",        fr: "la batterie",          family: "drum",    styles: [J, R] },
  { id: "djembe",          en: "djembe",          fr: "le djembé",            family: "drum",    styles: [W] },
  { id: "bongos",          en: "bongos",          fr: "les bongos",           family: "drum",    styles: [W], many: true },
  { id: "taiko",           en: "taiko drum",      fr: "le taiko",             family: "drum",    styles: [W] },
  { id: "tabla",           en: "tabla",           fr: "le tabla",             family: "drum",    styles: [W] },
  // tuned percussion
  { id: "xylophone",       en: "xylophone",       fr: "le xylophone",         family: "mallet",  styles: [O] },
  { id: "glockenspiel",    en: "glockenspiel",    fr: "le glockenspiel",      family: "mallet",  styles: [O] },
  { id: "kalimba",         en: "kalimba",         fr: "le kalimba",           family: "mallet",  styles: [W] },
  { id: "steel-drum",      en: "steel drum",      fr: "le steel drum",        family: "mallet",  styles: [W] },
  { id: "music-box",       en: "music box",       fr: "la boîte à musique",   family: "mallet",  styles: [W] },
  // metal
  { id: "bell",            en: "bell",            fr: "la cloche",            family: "metal",   styles: [O] },
  { id: "triangle",        en: "triangle",        fr: "le triangle",          family: "metal",   styles: [O] },
  { id: "cymbals",         en: "cymbals",         fr: "les cymbales",         family: "metal",   styles: [O], many: true },
  { id: "cowbell",         en: "cowbell",         fr: "la cloche à vache",    family: "metal",   styles: [R, W] },
  { id: "jingle-bells",    en: "jingle bells",    fr: "les grelots",          family: "metal",   styles: [W], many: true },
  // shakers and wood
  { id: "maracas",         en: "maracas",         fr: "les maracas",          family: "shaker",  styles: [W], many: true },
  { id: "tambourine",      en: "tambourine",      fr: "le tambourin",         family: "shaker",  styles: [R, W] },
  { id: "castanets",       en: "castanets",       fr: "les castagnettes",     family: "wood",    styles: [W], many: true },
  { id: "claves",          en: "claves",          fr: "les claves",           family: "wood",    styles: [W], many: true },
  { id: "guiro",           en: "guiro",           fr: "le guiro",             family: "wood",    styles: [W] },
  { id: "woodblock",       en: "wood block",      fr: "le wood-block",        family: "wood",    styles: [W] },
];

// Styles for the picker; `pic` is the instrument shown on its button.
const STYLES = [
  { id: "all",  pic: "violin",          en: "All",        fr: "Tout" },
  { id: O,      pic: "cello",           en: "Orchestra",  fr: "Orchestre" },
  { id: J,      pic: "saxophone",       en: "Jazz",       fr: "Jazz" },
  { id: R,      pic: "electric-guitar", en: "Rock & pop", fr: "Rock & pop" },
  { id: W,      pic: "djembe",          en: "World",      fr: "Monde" },
];

const TEXT = {
  en: { where: (n, many) => `Where ${many ? "are" : "is"} the ${n}?`, listen: "Listen! Who is playing?", yes: n => `Yes! The ${n}!`, no: "Try again!", bravo: "Bravo! You did it!", flag: "🇬🇧", voice: "en-US" },
  fr: { where: (n, many) => `Où ${many ? "sont" : "est"} ${n} ?`, listen: "Écoute ! Qui joue ?", yes: n => `Oui ! C'est ${n} !`, no: "Essaie encore !", bravo: "Bravo ! Tu as réussi !", flag: "🇫🇷", voice: "fr-FR" },
};

const ROUNDS = 10;
const CHOICES = 3;

let lang = "en";
try { lang = localStorage.getItem("quiz-lang") || (navigator.language.startsWith("fr") ? "fr" : "en"); } catch (e) {}
let style = "all";
try { style = localStorage.getItem("quiz-style") || "all"; } catch (e) {}
let deck = []; // instruments still to ask this game, so nothing repeats
let mode = "name", round = 0, stars = 0, answer = null, locked = false, firstTry = true, lastAnswer = null;
let gameId = 0; // bumps when a game starts or ends, so its pending timers do nothing
let questionId = 0; // bumps every question so stale timers/speech callbacks do nothing

const $ = id => document.getElementById(id);

// ---------- Speech ----------
function say(text, onDone) {
  let done = false;
  const finish = () => { if (!done) { done = true; onDone && onDone(); } };
  if (!("speechSynthesis" in window)) { setTimeout(finish, 300); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = TEXT[lang].voice;
  u.rate = 0.85;
  u.pitch = 1.2;
  const v = speechSynthesis.getVoices().find(v => v.lang.replace("_", "-").startsWith(lang));
  if (v) u.voice = v;
  u.onend = finish;
  u.onerror = finish;
  speechSynthesis.speak(u);
  if (onDone) setTimeout(finish, 2500); // some browsers never fire onend
}

// ---------- Sounds ----------
let ctx, current, playToken = 0;
const buffers = {}; // id -> Promise<AudioBuffer>
function audio() {
  ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
  if (ctx.state === "suspended") ctx.resume();
  return ctx;
}
// Decode an embedded recording the first time it is needed (data: URIs, so it also
// works when the page is opened as a local file). Tunes are keyed by instrument id,
// play-mode sounds by "id#k".
function recording(id) {
  const [iid, k] = id.split("#");
  const uri = k === undefined ? (window.INSTRUMENT_SOUNDS || {})[iid] : ((window.INSTRUMENT_NOTES || {})[iid] || { samples: [] }).samples[k];
  if (!buffers[id] && uri) {
    const bin = atob(uri.split(",")[1]);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    buffers[id] = new Promise((ok, fail) => audio().decodeAudioData(bytes.buffer, ok, fail));
    buffers[id].catch(() => { delete buffers[id]; });
  }
  return buffers[id] || Promise.reject();
}
function tone(freq, start, len, wave = "sine", vol = 0.25) {
  const a = audio(), o = a.createOscillator(), g = a.createGain();
  o.type = wave; o.frequency.value = freq;
  const t = a.currentTime + start;
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.001, t + len);
  o.connect(g).connect(a.destination);
  o.start(t); o.stop(t + len + 0.05);
}
function playInstrument(inst) {
  if (current) { try { current.stop(); } catch (e) {} current = null; }
  const token = ++playToken;
  // waits for the recording if it is still decoding; a newer play request wins
  recording(inst.id).then(b => {
    if (token !== playToken) return;
    const src = audio().createBufferSource();
    src.buffer = b;
    src.connect(audio().destination);
    src.start();
    current = src;
  }, () => {});
}
// Play-mode keys: a pentatonic scale, so every combination sounds nice.
const KEY_STEPS = [-5, -3, 0, 2, 4, 7, 9, 12];
const KEY_COLORS = ["#e53935", "#fb8c00", "#fdd835", "#7cb342", "#26a69a", "#1e88e5", "#5e35b1", "#d81b60"];
function playNote(inst, k) {
  if (current) { try { current.stop(); } catch (e) {} current = null; playToken++; }
  const info = window.INSTRUMENT_NOTES[inst.id];
  // several sounds (drum kit, tabla): one per key; one sound: tuned up and down
  const many = info.samples.length > 1;
  const steps = many ? 0 : info.pitched ? KEY_STEPS[k] : KEY_STEPS[k] / 2;
  recording(inst.id + "#" + (many ? k % info.samples.length : 0)).then(b => {
    const src = audio().createBufferSource();
    src.buffer = b;
    src.playbackRate.value = Math.pow(2, steps / 12);
    src.connect(audio().destination);
    src.start();
  }, () => {});
}
function cheer() { [523, 659, 784, 1047].forEach((n, i) => tone(n, i * 0.09, 0.25, "triangle", 0.2)); }
function boop() { tone(220, 0, 0.2, "sine", 0.2); tone(180, 0.12, 0.25, "sine", 0.2); }

// ---------- Game ----------
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

function stylePool() { return style === "all" ? INSTRUMENTS : INSTRUMENTS.filter(i => i.styles.includes(style)); }

function renderStyles() {
  document.querySelectorAll(".style").forEach(b => {
    const st = STYLES.find(x => x.id === b.dataset.style);
    b.setAttribute("aria-pressed", st.id === style);
    b.querySelector("span").textContent = st[lang];
  });
}

function renderStars() { $("stars").textContent = "⭐".repeat(stars); }

function promptText() { return mode === "listen" ? TEXT[lang].listen : TEXT[lang].where(answer[lang], answer.many); }

// Ask (or re-ask) the current question: speak the name, or say "Listen!" then play the sound.
function ask() {
  const q = questionId;
  if (mode === "listen") say(TEXT[lang].listen, () => { if (q === questionId) playInstrument(answer); });
  else say(TEXT[lang].where(answer[lang], answer.many));
}

function askQuestion() {
  locked = false; firstTry = true; questionId++;
  const pool = stylePool();
  // go through the style's instruments in random order before repeating any
  if (!deck.length) deck = shuffle(pool.filter(i => i !== lastAnswer));
  answer = deck.pop();
  lastAnswer = answer;
  recording(answer.id); // start decoding now so the sound is ready
  // wrong choices come from other families, so pictures and sounds are easy to tell
  // apart; prefer instruments from the same style
  const others = [];
  for (const i of [...shuffle(pool), ...shuffle(INSTRUMENTS)]) {
    if (others.length < CHOICES - 1 && i.family !== answer.family && !others.some(o => o.family === i.family)) others.push(i);
  }
  const options = shuffle([answer, ...others]);

  const box = $("choices");
  box.innerHTML = "";
  options.forEach(inst => {
    const b = document.createElement("button");
    b.className = "choice";
    b.dataset.id = inst.id;
    b.setAttribute("aria-label", inst[lang]);
    const img = document.createElement("img");
    img.src = window.INSTRUMENT_PICTURES[inst.id];
    img.alt = "";
    const label = document.createElement("span");
    label.className = "label";
    b.append(img, label);
    b.onclick = () => pick(inst, b);
    box.appendChild(b);
  });
  $("promptText").textContent = promptText();
  ask();
}

// "la flûte à bec" -> "Flûte à bec", for the written name on a card
function shortName(inst) {
  const n = inst[lang].replace(/^(le |la |les |l')/, "");
  return n.charAt(0).toUpperCase() + n.slice(1);
}

function showName(btn, inst) {
  btn.querySelector(".label").textContent = shortName(inst);
  btn.classList.add("named");
}

function pick(inst, btn) {
  if (locked) return;
  const q = questionId;
  showName(btn, inst);
  if (inst === answer) {
    locked = true;
    questionId++; // cancel any pending replay of the question
    btn.classList.add("right");
    $("promptText").textContent = TEXT[lang].yes(inst[lang]);
    cheer();
    if (firstTry) { stars++; renderStars(); }
    confetti(12);
    round++;
    const g = gameId;
    const next = () => { if (g === gameId) (round >= ROUNDS ? finish : askQuestion)(); };
    if (mode === "name") {
      // "Yes! The guitar!" and then let them hear it
      say(TEXT[lang].yes(inst[lang]), () => { playInstrument(inst); setTimeout(next, 3000); });
    } else {
      say(TEXT[lang].yes(inst[lang]));
      setTimeout(next, 2400);
    }
  } else {
    firstTry = false;
    btn.classList.add("wrong");
    btn.disabled = true;
    boop();
    if (mode === "listen") {
      // play the right sound again so they can compare
      setTimeout(() => { if (q === questionId) playInstrument(answer); }, 500);
    } else {
      // say what they tapped, then gently repeat the question
      say(`${inst[lang].replace(/^(le |la |les |l')/, "")}. ${TEXT[lang].no}`);
      setTimeout(() => { if (q === questionId) say(TEXT[lang].where(answer[lang], answer.many)); }, 1800);
    }
  }
}

// ---------- Play mode ----------
let playing = null; // instrument on the stage

function selectInstrument(inst, speak = true) {
  playing = inst;
  $("bigPic").querySelector("img").src = window.INSTRUMENT_PICTURES[inst.id];
  $("bigName").textContent = inst[lang].replace(/^(le |la |les |l')/, "");
  document.querySelectorAll(".thumb").forEach(t => t.setAttribute("aria-pressed", t.dataset.id === inst.id));
  recording(inst.id + "#0");
  if (speak) {
    const q = ++questionId;
    say(inst[lang], () => { if (q === questionId) playTune(); });
  }
}

function playTune() {
  const big = $("bigPic");
  big.classList.remove("bounce"); void big.offsetWidth; big.classList.add("bounce");
  playInstrument(playing);
}

function enterPlay() {
  const grid = $("grid");
  grid.innerHTML = "";
  stylePool().forEach(inst => {
    const b = document.createElement("button");
    b.className = "thumb";
    b.dataset.id = inst.id;
    b.setAttribute("aria-label", inst[lang]);
    const img = document.createElement("img");
    img.src = window.INSTRUMENT_PICTURES[inst.id];
    img.alt = "";
    b.appendChild(img);
    b.onclick = () => selectInstrument(inst);
    grid.appendChild(b);
  });
  selectInstrument(stylePool()[0], false);
}

// keys: press, or slide a finger across them
const pressed = new Map(); // pointerId -> key index
function keyAt(x, y) {
  const el = document.elementFromPoint(x, y);
  return el && el.classList.contains("key") ? +el.dataset.k : -1;
}
function press(pointerId, k) {
  if (pressed.get(pointerId) === k) return;
  const old = pressed.get(pointerId);
  if (old !== undefined && old >= 0) $("keys").children[old].classList.remove("on");
  pressed.set(pointerId, k);
  if (k >= 0) { $("keys").children[k].classList.add("on"); playNote(playing, k); }
}
function release(e) {
  const k = pressed.get(e.pointerId);
  if (k !== undefined && k >= 0) $("keys").children[k].classList.remove("on");
  pressed.delete(e.pointerId);
}

function goHome() {
  gameId++; questionId++; playToken++;
  if (current) { try { current.stop(); } catch (e) {} current = null; }
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  ["promptRow", "choices", "play", "homeBtn"].forEach(id => $(id).classList.add("hidden"));
  document.querySelector("main").classList.remove("playing");
  $("home").classList.remove("hidden");
  stars = 0; renderStars();
}

function finish() {
  say(TEXT[lang].bravo);
  confetti(60);
  $("promptRow").classList.add("hidden");
  $("choices").classList.add("hidden");
  $("home").classList.remove("hidden");
  $("homeBtn").classList.add("hidden");
}

function start(m) {
  audio();
  gameId++;
  mode = m;
  $("homeBtn").classList.remove("hidden");
  if (m === "play") {
    $("home").classList.add("hidden");
    $("play").classList.remove("hidden");
    document.querySelector("main").classList.add("playing");
    stars = 0; renderStars();
    enterPlay();
    return;
  }
  round = 0; stars = 0; lastAnswer = null; deck = []; renderStars();
  $("speak").textContent = mode === "listen" ? "👂" : "🔊";
  $("home").classList.add("hidden");
  $("promptRow").classList.remove("hidden");
  $("choices").classList.remove("hidden");
  askQuestion();
}

function confetti(n) {
  const bits = ["🎵", "🎶", "⭐", "🎉", "✨"];
  for (let i = 0; i < n; i++) {
    const s = document.createElement("span");
    s.className = "confetti";
    s.textContent = bits[i % bits.length];
    s.style.left = Math.random() * 90 + "vw";
    s.style.animationDuration = 1.5 + Math.random() * 1.5 + "s";
    s.style.animationDelay = Math.random() * 0.5 + "s";
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 3600);
  }
}

function setLang(l) {
  lang = l;
  try { localStorage.setItem("quiz-lang", l); } catch (e) {}
  $("lang").textContent = TEXT[l].flag;
  document.documentElement.lang = l;
  renderStyles();
  if (answer && !$("choices").classList.contains("hidden")) {
    document.querySelectorAll(".choice").forEach(b => {
      const inst = INSTRUMENTS.find(i => i.id === b.dataset.id);
      if (inst) b.setAttribute("aria-label", inst[lang]);
      if (inst && b.classList.contains("named")) b.querySelector(".label").textContent = shortName(inst);
    });
    $("promptText").textContent = locked ? TEXT[lang].yes(answer[lang]) : promptText();
    if (!locked) ask();
  }
  if (playing && !$("play").classList.contains("hidden")) {
    document.querySelectorAll(".thumb").forEach(b => b.setAttribute("aria-label", INSTRUMENTS.find(i => i.id === b.dataset.id)[lang]));
    selectInstrument(playing, false);
  }
}

document.querySelectorAll(".start").forEach(b => b.onclick = () => start(b.dataset.mode));
STYLES.forEach(st => {
  const b = document.createElement("button");
  b.className = "style";
  b.dataset.style = st.id;
  const img = document.createElement("img");
  img.src = window.INSTRUMENT_PICTURES[st.pic];
  img.alt = "";
  b.append(img, document.createElement("span"));
  b.onclick = () => {
    style = st.id;
    try { localStorage.setItem("quiz-style", style); } catch (e) {}
    renderStyles();
    playInstrument(INSTRUMENTS.find(i => i.id === st.pic)); // a taste of the style
  };
  $("styles").appendChild(b);
});
$("speak").onclick = () => { if (!locked) ask(); };
document.querySelectorAll(".mini").forEach(el => el.dataset.pics.split(" ").forEach(id => {
  const img = document.createElement("img");
  img.src = window.INSTRUMENT_PICTURES[id];
  img.alt = "";
  el.appendChild(img);
}));
KEY_COLORS.forEach((c, k) => {
  const key = document.createElement("div");
  key.className = "key";
  key.dataset.k = k;
  key.style.background = c;
  $("keys").appendChild(key);
});
$("keys").addEventListener("pointerdown", e => { e.preventDefault(); $("keys").releasePointerCapture?.(e.pointerId); press(e.pointerId, keyAt(e.clientX, e.clientY)); });
$("keys").addEventListener("pointermove", e => { if (pressed.has(e.pointerId)) press(e.pointerId, keyAt(e.clientX, e.clientY)); });
["pointerup", "pointercancel", "pointerleave"].forEach(t => $("keys").addEventListener(t, release));
$("bigPic").onclick = () => { questionId++; playTune(); };
$("homeBtn").onclick = goHome;
$("lang").onclick = () => setLang(lang === "en" ? "fr" : "en");
setLang(lang);
</script>
</body>
</html>
